name: PyPI-Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'tag/v**'

jobs:
  build_dist:
    name: Build source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Build SDist and wheel
        run: uv build

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: artifact
          path: dist/*

      - name: Check metadata
        run: uvx twine check dist/*
  publish:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    needs: [ build_dist ]
    outputs:
      release_needed: ${{ steps.release_check.outputs.release_needed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check release tag
        id: release_check
        run: |
          version=$(grep -oP '__version__ = "\K[^"]+' src/cloudevents/__init__.py)
          if git show-ref --verify --quiet "refs/tags/$version"; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8.0.1
        if: steps.release_check.outputs.release_needed == 'true'
        with:
          name: artifact
          path: dist
      - name: Publish
        if: steps.release_check.outputs.release_needed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.pypi_password }}
  tag:
    runs-on: ubuntu-24.04
    needs: [ publish ]
    if: needs.publish.outputs.release_needed == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Extract version
        id: version
        run: |
          echo "version=$(grep -oP '__version__ = \"\K[^\"]+' src/cloudevents/__init__.py)" >> $GITHUB_OUTPUT
      - name: Create and push tag
        uses: pxpm/github-tag-action@1.0.1
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          tag: ${{ steps.version.outputs.version }}
